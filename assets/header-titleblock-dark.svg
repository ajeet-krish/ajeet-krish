  <text x="611" y="107" font-size="7" letter-spacing="1" fill="#8B949E">REV</text>
  <text x="611" y="121" font-size="10" fill="#C9D1D9">2026.11</text>

  <text x="719" y="107" font-size="7" letter-spacing="1" fill="#8B949E">SCALE</text>
  <text x="719" y="121" font-size="10" fill="#C9D1D9">1:1</text>

  <!-- Field cells: row 2 -->
  <text x="503" y="137" font-size="7" letter-spacing="1" fill="#8B949E">SHEET</text>
  <text x="503" y="151" font-size="10" fill="#C9D1D9">1 OF 1</text>

  <text x="611" y="137" font-size="7" letter-spacing="1" fill="#8B949E">DRAWN BY</text>
  <text x="611" y="151" font-size="10" fill="#C9D1D9">A. KRISHNASAMY</text>

