<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" role="img" aria-label="Ajeet Krishnasamy, technical drawing title block">
  <title>Ajeet Krishnasamy, technical drawing title block</title>
  <defs>
