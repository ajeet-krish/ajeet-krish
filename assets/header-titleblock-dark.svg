  <circle cx="240" cy="100" r="20" fill="none" stroke="#C9D1D9" stroke-width="0.9" stroke-dasharray="7 2 1.5 2"/>
  <circle cx="240" cy="100" r="12" fill="none" stroke="#C9D1D9" stroke-width="1"/>
  <g stroke="#8B949E" stroke-width="0.6" fill="none">
    <line x1="212" y1="119" x2="212" y2="141"/>
    <line x1="268" y1="119" x2="268" y2="141"/>
    <line x1="212" y1="138" x2="231" y2="138"/>
    <line x1="249" y1="138" x2="268" y2="138"/>
  </g>
  <polygon points="212,138 218.5,136.3 218.5,139.7" fill="#8B949E"/>
  <polygon points="268,138 261.5,136.3 261.5,139.7" fill="#8B949E"/>
  <text x="240" y="140.8" font-size="8" fill="#8B949E" text-anchor="middle">M12</text>
  <path d="M 250 73.4 L 247.5 69.1 M 250 73.4 L 255 64.7 L 247 64.7" fill="none" stroke="#8B949E" stroke-width="0.7"/>

  <!-- Quiet series label -->
  <text x="20" y="180" font-size="9" letter-spacing="2" fill="#8B949E">TECHNICAL DRAWING &#183; PROFILE SERIES</text>

  <!-- Sheet frame -->
  <rect x="4" y="4" width="792" height="192" fill="none" stroke="#C9D1D9" stroke-width="1.5"/>
  <line x1="496" y1="4" x2="496" y2="56" stroke="#C9D1D9" stroke-width="1"/>

