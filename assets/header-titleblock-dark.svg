  <g stroke="#C9D1D9" stroke-width="1">
    <line x1="496" y1="96" x2="796" y2="96"/>
    <line x1="496" y1="126" x2="796" y2="126"/>
    <line x1="496" y1="156" x2="796" y2="156"/>
    <line x1="604" y1="96" x2="604" y2="156"/>
    <line x1="712" y1="96" x2="712" y2="156"/>
  </g>

  <!-- Name row -->
  <text x="503" y="68" font-size="7" letter-spacing="1.5" fill="#8B949E">TITLE</text>
  <text x="503" y="88" font-size="19" font-weight="bold" letter-spacing="0.5" fill="#C9D1D9">AJEET KRISHNASAMY</text>

  <!-- Field cells: row 1 -->
  <text x="503" y="107" font-size="7" letter-spacing="1" fill="#8B949E">DWG NO</text>
